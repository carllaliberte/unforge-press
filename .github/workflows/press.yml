name: press
on: [push, pull_request]
permissions:
  contents: read
jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: tests
        run: python3 -m unittest discover -s tests -v
      - name: print
        run: |
          python3 press.py --schema | python3 -c "import json,sys; s=json.load(sys.stdin); assert s['title']=='unforge.press.v0'"
          python3 press.py examples/bienvenue.txt.unforge.json -o /tmp/card.html
          python3 press.py examples/bienvenue.txt -o /tmp/voisin.html
          test -f /tmp/card.html
          grep -q "QT-PR-DEMO0001" /tmp/card.html
          grep -q "unforge-press" /tmp/card.html
          grep -q "Carte de poche" /tmp/card.html
          grep -q "Not a payment Wallet" /tmp/card.html
          grep -q "Not a receipt" /tmp/card.html
          if grep -q "VERT" /tmp/card.html; then echo "print must not say VERT"; exit 1; fi
          if grep -qiE 'Apple Wallet|Google Wallet|Add to Wallet|App Store|pkpass' /tmp/card.html; then echo "print must not be a payment Wallet"; exit 1; fi
          python3 press.py examples/bienvenue.txt.unforge.json -o /tmp/poche.html
          grep -q "Carte de poche" /tmp/poche.html
          grep -q "Share or print" /tmp/poche.html
      - name: kit-presse-mesure
        run: |
          cp examples/bienvenue.txt.mesure.json /tmp/bienvenue.txt.mesure.json
          python3 press.py examples/bienvenue.txt.unforge.json --mesure /tmp/bienvenue.txt.mesure.json -o /tmp/kit.html
          grep -q "MESURE consommée" /tmp/kit.html
          grep -q '"consomme": true' /tmp/kit.html
          if grep -q "VERT" /tmp/kit.html; then echo "print must not say VERT"; exit 1; fi
          python3 -c "import json; c=json.load(open('/tmp/bienvenue.txt.mesure.json')); assert c['lectures']==0 and c['detruit'] is True and 'consomme' not in c"
      - name: re-press-ancrage
        run: |
          python3 press.py examples/bienvenue.txt.unforge.json --ancrage examples/billet.ancrage.json -o /tmp/billet.html
          grep -q "ANCRAGE tient" /tmp/billet.html
          grep -q '"verifie": true' /tmp/billet.html
          grep -q "billet" /tmp/billet.html
          if grep -q "VERT" /tmp/billet.html; then echo "print must not say VERT"; exit 1; fi
          python3 -c "import json; c=json.load(open('examples/billet.ancrage.json')); assert c=={'format':'ANCRAGE-v0','objet':'billet','avant':'2028-08-31'} and 'verifie' not in c"
          python3 press.py examples/bienvenue.txt.unforge.json --ancrage examples/garantie.ancrage.json -o /tmp/garantie.html
          grep -q "ANCRAGE tient" /tmp/garantie.html
          grep -q "garantie" /tmp/garantie.html
          python3 -c "import json; c=json.load(open('examples/garantie.ancrage.json')); assert c=={'format':'ANCRAGE-v0','objet':'garantie','avant':'2028-08-31'} and 'verifie' not in c"
          python3 -c "import json; json.dump({'format':'ANCRAGE-v0','objet':'billet','avant':'2020-01-01'}, open('/tmp/expire.ancrage.json','w'))"
          if python3 press.py examples/bienvenue.txt.unforge.json --ancrage /tmp/expire.ancrage.json -o /tmp/no.html; then echo "expired must refuse"; exit 1; fi
          test ! -f /tmp/no.html
          python3 press.py examples/bienvenue.txt.unforge.json --ancrage /tmp/expire.ancrage.json -o /tmp/no.html | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['ok'] is False and r['erreur']=='ancrage perime' and 're-mesurer' in r['phrase'] and 'VERT' not in r['phrase']"
